<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hand & Body Tracker</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050608;overflow:hidden;font-family:"Courier New",monospace;font-weight:700;color:#e8f0ff}
#v,#cv,#pt{position:fixed;inset:0;width:100%;height:100%}
#v{object-fit:cover}#cv,#pt{pointer-events:none}
.bar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;right:10px;display:flex;gap:10px;align-items:center;z-index:5}
.pill{background:#1c2250dd;border:2px solid #5a6aa8;border-radius:24px;padding:12px 14px;font-size:15px;letter-spacing:1px;white-space:nowrap}
.pill b{color:#d58cff}
.sq{background:#26252add;border:2px solid #5b5b60;border-radius:18px;width:54px;height:54px;color:#4fe3d6;font-size:24px}
.cam{margin-left:auto;background:#44d9cb;color:#fff;border:0;border-radius:26px;padding:15px 18px;font:inherit;font-size:17px}
#panel{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 80px);width:min(64vw,300px);background:#1e3566ee;border:2px solid #7f95c4;border-radius:22px;padding:10px;z-index:5;font-size:14px}
#pw{position:relative}
#pv{width:100%;aspect-ratio:4/3;border-radius:18px;display:block;background:#222}
#ban{position:absolute;left:8px;right:8px;bottom:8px;background:#34d84ecc;border-radius:10px;padding:8px 4px;text-align:center;font-size:12px;color:#fff}
.row{display:flex;justify-content:space-between;margin-top:8px}.row b{color:#6ff0e0}
#dock{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;gap:12px;justify-content:center;z-index:5}
#dock button{background:#1e3566dd;border:2px solid #7f95c4;border-radius:22px;color:#fff;font:inherit;font-size:15px;padding:13px 18px}
#tip{position:fixed;left:12px;right:12px;bottom:90px;text-align:center;z-index:9;background:#000b;border-radius:12px;padding:10px;font-size:13px;display:none}
#xr{position:fixed;inset:0;display:none;z-index:20}#xc{width:100%;height:100%}
#xr button{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;background:#44d9cb;color:#fff;border:0;border-radius:20px;padding:12px 18px;font:inherit}
</style></head><body>
<video id="v" playsinline muted></video><canvas id="pt"></canvas><canvas id="cv"></canvas>
<div class="bar">
 <div class="pill">PARTICLES: <b id="pc">6K</b></div>
 <button class="sq" id="snd">🔇</button>
 <button class="cam" id="cam">Disable Cam</button>
</div>
<div id="panel"><div id="pw"><canvas id="pv" width="640" height="480"></canvas><div id="ban">LOADING MODELS...</div></div>
 <div class="row"><span>Palm Open:</span><b id="po">0%</b></div>
 <div class="row"><span>Hand Pos:</span><b id="hp">-, -</b></div></div>
<div id="dock"><button id="flip">🔄 前/后摄像头</button><button id="lid">📡 LiDAR 深度</button></div>
<div id="tip"></div>
<div id="xr"><canvas id="xc"></canvas><button id="xx">退出深度</button></div>

<script type="module">
import {FilesetResolver,HandLandmarker,PoseLandmarker,ObjectDetector} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const $=i=>document.getElementById(i),V=$('v'),C=$('cv'),X=C.getContext('2d'),P=$('pt'),PX=P.getContext('2d'),PV=$('pv'),PC=PV.getContext('2d');
const M='https://storage.googleapis.com/mediapipe-models/';
const CN={bird:'鸟 BIRD',cat:'猫 CAT',dog:'狗 DOG'};
let facing='user',stream=null,hand,pose,obj,hr=null,pr=null,dets=[],zoom=1,open=0,fr=0,snd=false,ac,osc,gn,camOn=true,inXR=false,cx=.5,cy=.5;
const ring=document.createElement('canvas');
const N=6000,pa=new Float32Array(N),pr_=new Float32Array(N),ps=new Float32Array(N);
for(let i=0;i<N;i++){pa[i]=Math.random()*6.28;pr_[i]=.25+Math.random()*.75;ps[i]=(Math.random()-.5)*.02}
const tip=t=>{const e=$('tip');e.textContent=t;e.style.display='block';clearTimeout(tip.t);tip.t=setTimeout(()=>e.style.display='none',6000)};
function size(){C.width=P.width=innerWidth;C.height=P.height=innerHeight}size();onresize=size;

async function startCam(){
 stopCam();
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}},audio:false});
  V.srcObject=stream;await V.play();V.style.transform=facing=='user'?'scaleX(-1)':'none';
  camOn=true;$('cam').textContent='Disable Cam';
 }catch(e){tip('无法打开摄像头：请用 HTTPS 地址访问并允许权限')}
}
function stopCam(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null}
$('cam').onclick=()=>{if(camOn){stopCam();camOn=false;$('cam').textContent='Enable Cam'}else startCam()};
$('flip').onclick=()=>{facing=facing=='user'?'environment':'user';startCam()};
$('snd').onclick=()=>{
 snd=!snd;$('snd').textContent=snd?'🔊':'🔇';
 if(snd&&!ac){ac=new AudioContext();osc=ac.createOscillator();gn=ac.createGain();gn.gain.value=.03;osc.connect(gn).connect(ac.destination);osc.start()}
 if(ac)gn.gain.value=snd?.03:0;
};

async function init(){
 const fs=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
 const mk=async(K,o,path)=>{for(const d of['GPU','CPU']){try{return await K.createFromOptions(fs,{baseOptions:{modelAssetPath:M+path,delegate:d},runningMode:'VIDEO',...o})}catch(e){}}};
 hand=await mk(HandLandmarker,{numHands:2},'hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task');
 pose=await mk(PoseLandmarker,{numPoses:2,outputSegmentationMasks:true},'pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task');
 obj=await mk(ObjectDetector,{scoreThreshold:.35,maxResults:10},'object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite');
}

function mask(ms){
 if(!ms||!ms.length){ring.width=0;return}
 const w=ms[0].width,h=ms[0].height,sil=document.createElement('canvas');
 sil.width=ring.width=w;sil.height=ring.height=h;
 const s=sil.getContext('2d'),im=s.createImageData(w,h),d=im.data,a=ms.map(m=>m.getAsFloat32Array());
 for(let i=0;i<w*h;i++){let v=0;for(const q of a)if(q[i]>v)v=q[i];if(v>.5){d[i*4+1]=255;d[i*4+2]=240;d[i*4+3]=255}}
 s.putImageData(im,0,0);
 const r=ring.getContext('2d'),k=3;
 for(const[x,y]of[[-k,0],[k,0],[0,-k],[0,k],[-k,-k],[k,k],[-k,k],[k,-k]])r.drawImage(sil,x,y);
 r.globalCompositeOperation='destination-out';r.drawImage(sil,0,0);
}
const G=cv=>{const vw=V.videoWidth,vh=V.videoHeight,s=Math.max(cv.width/vw,cv.height/vh),ox=(cv.width-vw*s)/2,oy=(cv.height-vh*s)/2,m=facing=='user';
 return{vw,vh,s,ox,oy,m,f:p=>{const x=p.x*vw*s+ox;return[m?cv.width-x:x,p.y*vh*s+oy]}}};
function skel(ctx,g,L,con,lw,r,dash){
 ctx.setLineDash(dash?[8,5]:[]);ctx.strokeStyle='#4ff0a0';ctx.lineWidth=lw;ctx.beginPath();
 for(const{start:a,end:b}of con){const A=g.f(L[a]),B=g.f(L[b]);ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1])}
 ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#ff2d55';
 for(const p of L){const[x,y]=g.f(p);ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
}
function loop(){
 requestAnimationFrame(loop);
 const W=C.width,H=C.height;X.clearRect(0,0,W,H);PX.clearRect(0,0,W,H);
 if(!stream||V.readyState<2||inXR){$('ban').textContent=stream?'...':'CAMERA OFF';$('ban').style.background='#555c';return}
 if(!hand||!pose||!obj){$('ban').textContent='LOADING MODELS...';return}
 const ts=performance.now();fr++;
 hr=hand.detectForVideo(V,ts);
 if(fr%2==0)pose.detectForVideo(V,ts,r=>{pr=r.landmarks;mask(r.segmentationMasks)});
 if(fr%4==0)dets=obj.detectForVideo(V,ts).detections||[];
 const g=G(C);
 if(ring.width){X.save();if(g.m){X.translate(W,0);X.scale(-1,1)}X.shadowColor='#0ff';X.shadowBlur=14;X.drawImage(ring,g.ox,g.oy,g.vw*g.s,g.vh*g.s);X.restore()}
 if(pr)for(const L of pr)skel(X,g,L,PoseLandmarker.POSE_CONNECTIONS,3,5,false);
 if(hr)for(const L of hr.landmarks)skel(X,g,L,HandLandmarker.HAND_CONNECTIONS,3,6,true);
 for(const d of dets){
  const c=d.categories[0],n=c.categoryName;if(!CN[n])continue;
  const b=d.boundingBox,A=g.f({x:b.originX/g.vw,y:b.originY/g.vh}),B=g.f({x:(b.originX+b.width)/g.vw,y:(b.originY+b.height)/g.vh});
  const x=Math.min(A[0],B[0]),y=Math.min(A[1],B[1]),w=Math.abs(B[0]-A[0]),h=Math.abs(B[1]-A[1]);
  X.strokeStyle='#ffd84a';X.lineWidth=3;X.strokeRect(x,y,w,h);
  X.fillStyle='#ffd84a';X.fillRect(x,y-24,150,24);X.fillStyle='#000';X.font='bold 15px "Courier New"';
  X.fillText(CN[n]+' '+Math.round(c.score*100)+'%',x+6,y-7);
 }
 // hand metrics
 const ban=$('ban');
 if(hr&&hr.landmarks[0]){
  const L=hr.landmarks[0],d=(a,b)=>Math.hypot(L[a].x-L[b].x,L[a].y-L[b].y);let r=0;
  for(const[t,m]of[[8,5],[12,9],[16,13],[20,17]])r+=d(t,0)/d(m,0);
  open=Math.max(0,Math.min(1,(r/4-1)/.75));
  const hx=g.m?1-L[9].x:L[9].x;$('hp').textContent=hx.toFixed(2)+', '+L[9].y.toFixed(2);
  const[sx,sy]=g.f(L[9]);cx+=(sx/W-cx)*.2;cy+=(sy/H-cy)*.2;
  if(open>.8){ban.textContent='OPEN PALM: ZOOM IN';ban.style.background='#34d84ecc';zoom=Math.min(3,zoom+.03)}
  else if(open<.25){ban.textContent='FIST: ZOOM OUT';ban.style.background='#ff8a2bcc';zoom=Math.max(.4,zoom-.03)}
  else{ban.textContent='TRACKING...';ban.style.background='#3a8fffcc'}
 }else{ban.textContent='SHOW YOUR HAND';ban.style.background='#555c';$('hp').textContent='-, -';open*=.9}
 $('po').textContent=Math.round(open*100)+'%';
 if(snd&&ac)osc.frequency.value=180+open*500;
 // preview panel
 const pg=G(PV);PC.clearRect(0,0,640,480);PC.save();if(pg.m){PC.translate(640,0);PC.scale(-1,1)}
 PC.drawImage(V,pg.ox,pg.oy,pg.vw*pg.s,pg.vh*pg.s);PC.restore();
 if(hr)for(const L of hr.landmarks)skel(PC,pg,L,HandLandmarker.HAND_CONNECTIONS,4,6,true);
 // particles
 const R=Math.min(W,H)*.22*zoom;PX.globalCompositeOperation='lighter';
 for(let i=0;i<N;i++){pa[i]+=ps[i];const q=pr_[i]*R;
  PX.fillStyle='hsla('+(190+pr_[i]*140)+',90%,60%,.55)';
  PX.fillRect(cx*W+Math.cos(pa[i])*q,cy*H+Math.sin(pa[i])*q*.8,2,2)}
 PX.globalCompositeOperation='source-over';
}
$('pc').textContent=(N/1000)+'K';

// ---- LiDAR / depth via WebXR (Android Chrome + ARCore) ----
$('lid').onclick=async()=>{
 if(!navigator.xr||!(await navigator.xr.isSessionSupported('immersive-ar').catch(()=>false)))
  return tip('此浏览器不支持 WebXR 深度。iPhone 的 Safari 网页无法调用 LiDAR（需原生App）；安卓 Chrome(ARCore) 可用');
 stopCam();inXR=true;$('xr').style.display='block';
 try{
  const s=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['depth-sensing'],optionalFeatures:['dom-overlay'],domOverlay:{root:$('xr')},
   depthSensing:{usagePreference:['cpu-optimized'],dataFormatPreference:['luminance-alpha']}});
  const gl=document.createElement('canvas').getContext('webgl',{xrCompatible:true});
  s.updateRenderState({baseLayer:new XRWebGLLayer(s,gl)});
  const ref=await s.requestReferenceSpace('local'),xc=$('xc'),xg=xc.getContext('2d'),tmp=document.createElement('canvas'),tg=tmp.getContext('2d');
  const end=()=>{s.end()};$('xx').onclick=end;
  s.addEventListener('end',()=>{inXR=false;$('xr').style.display='none';startCam()});
  s.requestAnimationFrame(function f(t,frame){
   s.requestAnimationFrame(f);
   gl.bindFramebuffer(gl.FRAMEBUFFER,s.renderState.baseLayer.framebuffer);gl.clear(gl.COLOR_BUFFER_BIT);
   const p=frame.getViewerPose(ref);if(!p)return;
   const d=frame.getDepthInformation(p.views[0]);if(!d)return;
   const u=new Uint16Array(d.data),w=d.width,h=d.height;tmp.width=w;tmp.height=h;
   const im=tg.createImageData(w,h);
   for(let i=0;i<w*h;i++){const m=u[i]*d.rawValueToMeters;if(!m){continue}
    const k=Math.min(1,m/5),hue=(1-k)*240;const c=hsl(hue);im.data[i*4]=c[0];im.data[i*4+1]=c[1];im.data[i*4+2]=c[2];im.data[i*4+3]=170}
   tg.putImageData(im,0,0);xc.width=innerWidth;xc.height=innerHeight;xg.drawImage(tmp,0,0,xc.width,xc.height);
   xg.fillStyle='#fff';xg.font='bold 14px "Courier New"';xg.fillText('红=近  蓝=远 (0–5m)',14,innerHeight-24);
  });
 }catch(e){inXR=false;$('xr').style.display='none';startCam();tip('深度模式启动失败：设备不支持 depth-sensing')}
};
function hsl(h){const a=.5,f=n=>{const k=(n+h/30)%12;return Math.round(255*(.5-a*Math.max(-1,Math.min(k-3,9-k,1))))};return[f(0),f(8),f(4)]}

await startCam();loop();
try{await init()}catch(e){tip('模型加载失败：请检查网络（需访问 jsdelivr 和 Google 存储）')}
</script></body></html>
